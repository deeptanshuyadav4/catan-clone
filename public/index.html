<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catan Clone</title>

  <script src="board.js" defer></script>
  <script src="render.js" defer></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a3a5c;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      color: #fff;
    }

    /* ── TOP BAR ──────────────────────────────────────────────── */
    #top-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 14px;
      background: rgba(0, 0, 0, 0.28);
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
      text-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }

    #info-bar {
      font-size: 0.76rem;
      opacity: 0.88;
      min-height: 1.2em;
      white-space: nowrap;
      flex: 1;
      text-align: center;
    }

    .bar-sep {
      width: 1px;
      height: 22px;
      background: rgba(255, 255, 255, 0.22);
      flex-shrink: 0;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .control-label {
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.72rem;
      font-weight: bold;
      white-space: nowrap;
    }

    /* Player color circles — display-only, reflects current turn order */
    .player-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      padding: 0;
      cursor: default;
      pointer-events: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      transition: opacity 0.15s;
    }
    .player-btn.active {
      border: 2px solid #000;
      outline: 2px solid white;
      outline-offset: 1px;
    }

    /* All top-bar action / mode buttons */
    .top-btn {
      background: rgba(255, 255, 255, 0.14);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.76rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.1s, opacity 0.15s;
    }
    .top-btn.active {
      background: white;
      color: #1a1a2e;
      border-color: white;
    }
    .top-btn:hover:not(.active):not(:disabled) { background: rgba(255, 255, 255, 0.26); }
    .top-btn:disabled { cursor: not-allowed; }

    #roll-dice-btn {
      background: #d4850e;
      border-color: #b06a00;
      color: #fff;
    }
    #roll-dice-btn:hover:not(:disabled) { background: #e8960f; }

    #end-turn-btn {
      background: rgba(50, 150, 90, 0.55);
      border-color: rgba(60, 180, 100, 0.5);
      color: #fff;
    }
    #end-turn-btn:hover:not(:disabled) { background: rgba(50, 170, 100, 0.75); }

    /* Opening phase label */
    #opening-label {
      font-size: 0.78rem;
      font-weight: bold;
      color: #ffd700;
      white-space: nowrap;
      display: none;
    }

    /* Build cost reference */
    .cost-hint {
      font-size: 0.64rem;
      color: rgba(255, 255, 255, 0.48);
      white-space: nowrap;
      font-family: monospace;
      letter-spacing: 0.2px;
    }

    /* ── MAIN (board + right panel) ───────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 8px 12px;
      min-height: 0;
      overflow: hidden;
    }

    /* Left — SVG board */
    #board-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    #board {
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1;
      background: #2b8fd6;
      border-radius: 12px;
      box-shadow: 0 6px 28px rgba(0, 0, 0, 0.5);
    }

    #seed-label {
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.65rem;
      font-family: monospace;
      margin-top: 4px;
    }

    /* Right panel */
    #right-panel {
      width: 222px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow: hidden;
    }

    .panel-title {
      font-size: 0.68rem;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    /* Roll log */
    #roll-log-box { flex-shrink: 0; }
    #roll-log {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.72rem;
      color: #e8e8e8;
    }
    #roll-log p { margin: 2px 0; line-height: 1.45; }

    /* Player panels */
    #player-panels {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      min-height: 0;
    }

    .player-panel {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 8px;
      padding: 7px 10px;
      border-left: 3px solid transparent;
      flex-shrink: 0;
      transition: box-shadow 0.25s, transform 0.2s;
    }
    .player-panel[data-player="red"]    { border-left-color: #d33; }
    .player-panel[data-player="blue"]   { border-left-color: #36c; }
    .player-panel[data-player="white"]  { border-left-color: #ccc; }
    .player-panel[data-player="orange"] { border-left-color: #f80; }

    .player-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }
    .player-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .player-name {
      font-size: 0.8rem;
      font-weight: bold;
      flex: 1;
    }
    .player-vp {
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffd700;
    }
    .turn-badge {
      display: none;
      font-size: 0.58rem;
      font-weight: bold;
      background: #ffd700;
      color: #1a1a2e;
      border-radius: 3px;
      padding: 1px 4px;
      letter-spacing: 0.3px;
    }

    .player-resources {
      display: flex;
      gap: 3px;
    }
    .res-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .res-emoji { font-size: 0.82rem; line-height: 1; }
    .res-count { font-size: 0.78rem; font-weight: bold; }

    /* ── WINNER OVERLAY ───────────────────────────────────────── */
    #winner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #winner-box {
      background: #0d2035;
      border: 3px solid #fff;
      border-radius: 22px;
      padding: 44px 72px;
      text-align: center;
      animation: winner-pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes winner-pop {
      from { transform: scale(0.55); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    #winner-trophy {
      font-size: 3.8rem;
      margin-bottom: 14px;
      display: block;
      animation: trophy-float 1.1s ease-in-out infinite alternate;
    }

    @keyframes trophy-float {
      from { transform: translateY(0px); }
      to   { transform: translateY(-10px); }
    }

    #winner-title {
      font-size: 3rem;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
      text-shadow: 0 0 24px currentColor;
    }

    #winner-vp {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 32px;
    }

    #play-again-btn {
      background: white;
      color: #1a1a2e;
      border: none;
      border-radius: 14px;
      padding: 13px 40px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #play-again-btn:hover  { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,0.45); }
    #play-again-btn:active { transform: translateY(0);    box-shadow: 0 3px 10px rgba(0,0,0,0.3);  }
  </style>
</head>
<body>

  <!-- WINNER OVERLAY (hidden until someone reaches 10 VP) -->
  <div id="winner-overlay">
    <div id="winner-box">
      <span id="winner-trophy">🏆</span>
      <div id="winner-title">Red Wins!</div>
      <div id="winner-vp">10 Victory Points</div>
      <button id="play-again-btn">Play Again</button>
    </div>
  </div>

  <!-- TOP BAR -->
  <div id="top-bar">
    <h1>Catan Clone</h1>
    <div class="bar-sep"></div>

    <div class="control-group">
      <span class="control-label">Player</span>
      <button class="player-btn active" data-player="red"    style="background:#d33" title="Red"></button>
      <button class="player-btn"        data-player="blue"   style="background:#36c" title="Blue"></button>
      <button class="player-btn"        data-player="white"  style="background:#eee" title="White"></button>
      <button class="player-btn"        data-player="orange" style="background:#f80" title="Orange"></button>
    </div>

    <div class="bar-sep"></div>

    <div class="control-group">
      <span class="control-label">Mode</span>
      <button class="top-btn active" data-mode="settlement">Settlement</button>
      <button class="top-btn"        data-mode="city">City</button>
      <button class="top-btn"        data-mode="road">Road</button>
    </div>
    <span class="cost-hint">Road: 1🪵1🧱 · Settlement: 1🪵1🧱1🌾1🐑 · City: 2🌾3⛰️</span>

    <div class="bar-sep"></div>

    <button class="top-btn" id="clear-pieces-btn">Clear</button>
    <button class="top-btn" id="roll-dice-btn">🎲 Roll Dice</button>
    <button class="top-btn" id="end-turn-btn">End Turn →</button>
    <span id="opening-label"></span>
    <button class="top-btn" id="regenerate-btn">Regenerate</button>
    <button class="top-btn" id="balanced-btn">Balanced</button>
    <button class="top-btn" id="toggle-graph-btn">Graph</button>

    <div class="bar-sep"></div>
    <span id="info-bar">Click a tile to inspect it or move the robber</span>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- Board (left) -->
    <div id="board-area">
      <svg id="board"></svg>
      <div id="seed-label"></div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">

      <div id="roll-log-box">
        <div class="panel-title">Roll Log</div>
        <div id="roll-log"></div>
      </div>

      <div class="panel-title">Players</div>
      <div id="player-panels">

        <div class="player-panel" data-player="red">
          <div class="player-header">
            <span class="player-dot" style="background:#d33"></span>
            <span class="player-name">Red</span>
            <span class="player-vp">0 VP</span>
            <span class="turn-badge">TURN</span>
          </div>
          <div class="player-resources">
            <div class="res-item"><span class="res-emoji">🪵</span><span class="res-count" data-res="wood">0</span></div>
            <div class="res-item"><span class="res-emoji">🧱</span><span class="res-count" data-res="brick">0</span></div>
            <div class="res-item"><span class="res-emoji">🌾</span><span class="res-count" data-res="wheat">0</span></div>
            <div class="res-item"><span class="res-emoji">🐑</span><span class="res-count" data-res="wool">0</span></div>
            <div class="res-item"><span class="res-emoji">⛏️</span><span class="res-count" data-res="ore">0</span></div>
          </div>
        </div>

        <div class="player-panel" data-player="blue">
          <div class="player-header">
            <span class="player-dot" style="background:#36c"></span>
            <span class="player-name">Blue</span>
            <span class="player-vp">0 VP</span>
            <span class="turn-badge">TURN</span>
          </div>
          <div class="player-resources">
            <div class="res-item"><span class="res-emoji">🪵</span><span class="res-count" data-res="wood">0</span></div>
            <div class="res-item"><span class="res-emoji">🧱</span><span class="res-count" data-res="brick">0</span></div>
            <div class="res-item"><span class="res-emoji">🌾</span><span class="res-count" data-res="wheat">0</span></div>
            <div class="res-item"><span class="res-emoji">🐑</span><span class="res-count" data-res="wool">0</span></div>
            <div class="res-item"><span class="res-emoji">⛏️</span><span class="res-count" data-res="ore">0</span></div>
          </div>
        </div>

        <div class="player-panel" data-player="white">
          <div class="player-header">
            <span class="player-dot" style="background:#ccc"></span>
            <span class="player-name">White</span>
            <span class="player-vp">0 VP</span>
            <span class="turn-badge">TURN</span>
          </div>
          <div class="player-resources">
            <div class="res-item"><span class="res-emoji">🪵</span><span class="res-count" data-res="wood">0</span></div>
            <div class="res-item"><span class="res-emoji">🧱</span><span class="res-count" data-res="brick">0</span></div>
            <div class="res-item"><span class="res-emoji">🌾</span><span class="res-count" data-res="wheat">0</span></div>
            <div class="res-item"><span class="res-emoji">🐑</span><span class="res-count" data-res="wool">0</span></div>
            <div class="res-item"><span class="res-emoji">⛏️</span><span class="res-count" data-res="ore">0</span></div>
          </div>
        </div>

        <div class="player-panel" data-player="orange">
          <div class="player-header">
            <span class="player-dot" style="background:#f80"></span>
            <span class="player-name">Orange</span>
            <span class="player-vp">0 VP</span>
            <span class="turn-badge">TURN</span>
          </div>
          <div class="player-resources">
            <div class="res-item"><span class="res-emoji">🪵</span><span class="res-count" data-res="wood">0</span></div>
            <div class="res-item"><span class="res-emoji">🧱</span><span class="res-count" data-res="brick">0</span></div>
            <div class="res-item"><span class="res-emoji">🌾</span><span class="res-count" data-res="wheat">0</span></div>
            <div class="res-item"><span class="res-emoji">🐑</span><span class="res-count" data-res="wool">0</span></div>
            <div class="res-item"><span class="res-emoji">⛏️</span><span class="res-count" data-res="ore">0</span></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Socket.io client -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();
    socket.on('connect', () => console.log('connected to server'));

    document.addEventListener('DOMContentLoaded', () => {

      // ----- Element refs -----
      const svg          = document.getElementById('board');
      const infoBar      = document.getElementById('info-bar');
      const seedLabel    = document.getElementById('seed-label');
      const rollBtn      = document.getElementById('roll-dice-btn');
      const endBtn       = document.getElementById('end-turn-btn');
      const openingLabel = document.getElementById('opening-label');

      // ----- Lookup tables -----
      const RESOURCE = {
        forest: 'Wood', pasture: 'Wool', fields: 'Wheat',
        hills: 'Brick', mountains: 'Ore', desert: null,
      };
      const PROB = { 2:1, 3:2, 4:3, 5:4, 6:5, 8:5, 9:4, 10:3, 11:2, 12:1 };

      // ----- Board state -----
      let board;
      let graphVisible = false;

      const PLAYER_COLORS = { red: '#d33', blue: '#36c', white: '#eee', orange: '#f80' };
      const PLAYER_COLOR_GLOW = { red: '#d33', blue: '#36c', white: '#ccc', orange: '#f80' };
      let currentPlayer = 'red';
      let currentMode   = 'settlement';
      let errorTimer    = null;

      // ----- Winner overlay -----
      function triggerWin(playerId) {
        const vp    = Board.calculateVP(board, playerId);
        const color = PLAYER_COLOR_GLOW[playerId];
        const name  = playerId.charAt(0).toUpperCase() + playerId.slice(1);

        document.getElementById('winner-title').textContent = `${name} Wins!`;
        document.getElementById('winner-title').style.color = color;
        document.getElementById('winner-vp').textContent    = `${vp} Victory Points`;

        const box = document.getElementById('winner-box');
        box.style.borderColor = color;
        box.style.boxShadow   = `0 0 60px ${color}88, 0 0 120px ${color}44`;

        // Re-trigger the pop animation by cloning the box
        box.style.animation = 'none';
        box.offsetHeight;   // force reflow
        box.style.animation = '';

        document.getElementById('winner-overlay').style.display = 'flex';
      }

      document.getElementById('play-again-btn').addEventListener('click', () => {
        document.getElementById('winner-overlay').style.display = 'none';
        clearInfoBar();
        renderAndWire(Board.generateBoard());
      });

      // ----- UI helpers -----
      function showError(reason) {
        clearTimeout(errorTimer);
        infoBar.style.color = '#ff8080';
        infoBar.textContent = reason;
        errorTimer = setTimeout(clearInfoBar, 2000);
      }

      function clearInfoBar() {
        clearTimeout(errorTimer);
        errorTimer = null;
        infoBar.style.color = '';
        infoBar.textContent = 'Click a tile to inspect it or move the robber';
      }

      // Syncs currentPlayer + currentMode from game state, and updates all button visuals.
      // Player selector is always driven by turn order — manual clicks are disabled.
      function syncPlayerAndMode() {
        if (!board) return;
        const isOpening  = board.gameState.phase === 'opening';
        const turnPlayer = Board.getCurrentPlayer(board);

        // Always follow turn order — player selector is display-only
        currentPlayer = turnPlayer;
        if (isOpening) currentMode = board.gameState.openingStep;

        // Player selector circles — highlight only, no interaction
        document.querySelectorAll('.player-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.player === currentPlayer);
        });

        // Mode buttons — hide City during opening; dim unaffordable in main phase
        document.querySelectorAll('[data-mode]').forEach(btn => {
          const m      = btn.dataset.mode;
          const active = m === currentMode;
          if (m === 'city') btn.style.display = isOpening ? 'none' : '';
          btn.classList.toggle('active', active);
          btn.disabled = isOpening;

          if (isOpening) {
            btn.style.opacity = active ? '' : '0.35';
          } else {
            btn.style.opacity = (!active && !Board.canAfford(board, turnPlayer, m).valid)
              ? '0.5' : '';
          }
        });
      }

      // Updates player-panel glow, TURN badge, and Roll/End button states.
      function updateTurnUI() {
        if (!board) return;
        const isOpening = board.gameState.phase === 'opening';
        const active    = Board.getCurrentPlayer(board);

        // Player panel glow + TURN badge
        document.querySelectorAll('.player-panel').forEach(panel => {
          const p        = panel.dataset.player;
          const isActive = p === active;
          panel.style.boxShadow = isActive ? `0 0 14px 2px ${PLAYER_COLOR_GLOW[p]}` : '';
          panel.style.transform = isActive ? 'scale(1.04)' : '';
          const badge = panel.querySelector('.turn-badge');
          if (badge) badge.style.display = isActive ? 'inline' : 'none';
        });

        // Show opening label OR roll-dice / end-turn buttons
        if (isOpening) {
          rollBtn.style.display      = 'none';
          endBtn.style.display       = 'none';
          openingLabel.style.display = '';
          const gs       = board.gameState;
          const roundNum = gs.openingTurn < 4 ? 1 : 2;
          openingLabel.textContent = gs.openingStep === 'settlement'
            ? `Opening — ${active}: settlement ${roundNum} of 2`
            : `Opening — ${active}: place road`;
        } else {
          rollBtn.style.display      = '';
          endBtn.style.display       = '';
          openingLabel.style.display = 'none';

          const isRollPhase  = board.gameState.turnPhase === 'roll';
          const isBuildPhase = board.gameState.turnPhase === 'build';
          rollBtn.disabled      = !isRollPhase;
          rollBtn.style.opacity = isRollPhase  ? '' : '0.4';
          endBtn.disabled       = !isBuildPhase;
          endBtn.style.opacity  = isBuildPhase ? '' : '0.4';
        }

        syncPlayerAndMode();
      }

      // Updates VP (via calculateVP) and resource counts in all four player panels.
      function updatePlayerPanels() {
        if (!board) return;
        ['red', 'blue', 'white', 'orange'].forEach(player => {
          const panel = document.querySelector(`.player-panel[data-player="${player}"]`);
          if (!panel) return;
          panel.querySelector('.player-vp').textContent =
            `${Board.calculateVP(board, player)} VP`;
          const res = board.players[player];
          panel.querySelectorAll('.res-count').forEach(el => {
            el.textContent = res[el.dataset.res] ?? 0;
          });
        });
      }

      function applyGraphVisibility() {
        const g = svg.querySelector('#graph-debug');
        if (g) g.style.display = graphVisible ? '' : 'none';
      }

      // Full re-render — wipes the SVG and rebuilds all layers in z-order.
      function renderAndWire(b) {
        board = b;
        Render.renderBoard(svg, board);
        Render.attachClickHandlers(svg, board, onTileClick);
        Render.drawGraphDebug(svg, board);
        applyGraphVisibility();
        Render.drawPieces(svg, board, PLAYER_COLORS);
        Render.attachVertexClickHandlers(svg, board, onVertexClick);
        Render.attachEdgeClickHandlers(svg, board, onEdgeClick);
        seedLabel.textContent = `Seed: ${board.seed}`;
        updatePlayerPanels();
        updateTurnUI();
      }

      // ----- Click handlers -----
      function onTileClick(idx) {
        clearTimeout(errorTimer);
        errorTimer = null;
        infoBar.style.color = '';

        const type   = board.tiles[idx];
        const number = board.numbers[idx];

        if (type === 'desert') {
          infoBar.textContent = 'Desert — produces nothing, robber lives here';
          return;
        }

        board.robber = idx;
        renderAndWire(board);

        const resource = RESOURCE[type];
        const prob     = PROB[number] || 0;
        const label    = type.charAt(0).toUpperCase() + type.slice(1);
        infoBar.textContent = `${label} → ${resource} · rolls on ${number} · ${prob}/36 odds`;
      }

      function onVertexClick(vIdx) {
        if (board.gameState.gameEnded) return;

        const isOpening = board.gameState.phase === 'opening';

        // Turn-order gates
        if (!isOpening && board.gameState.turnPhase === 'roll') {
          showError('roll dice before building');
          return;
        }
        if (Board.getCurrentPlayer(board) !== currentPlayer) {
          const { x, y } = board.graph.vertices[vIdx];
          Render.flashInvalid(svg, x, y);
          showError(`not your turn — it's ${Board.getCurrentPlayer(board)}'s turn`);
          return;
        }
        if (isOpening && board.gameState.openingStep !== 'settlement') {
          const { x, y } = board.graph.vertices[vIdx];
          Render.flashInvalid(svg, x, y);
          showError('place your road first');
          return;
        }

        const { x, y } = board.graph.vertices[vIdx];

        if (currentMode === 'settlement') {
          const place = Board.canPlaceSettlement(board, vIdx, currentPlayer);
          if (!place.valid) { Render.flashInvalid(svg, x, y); showError(place.reason); return; }

          const afford = Board.canAfford(board, currentPlayer, 'settlement');
          if (!afford.valid) { Render.flashInvalid(svg, x, y); showError(afford.reason); return; }

          board.pieces.settlements[vIdx] = currentPlayer;
          Board.payCost(board, currentPlayer, 'settlement');

          if (isOpening) {
            board.gameState.lastSettlementVertex = vIdx;
            if (board.gameState.openingTurn >= 4) {
              Board.giveStartingResources(board, vIdx, currentPlayer);
            }
            Board.advanceOpening(board);
            syncPlayerAndMode();
          }

          Render.drawPieces(svg, board, PLAYER_COLORS);
          updatePlayerPanels();
          updateTurnUI();
          clearInfoBar();

          const winner = Board.checkWinner(board);
          if (winner) { triggerWin(winner); return; }

        } else if (currentMode === 'city') {
          const place = Board.canUpgradeToCity(board, vIdx, currentPlayer);
          if (!place.valid) { Render.flashInvalid(svg, x, y); showError(place.reason); return; }

          const afford = Board.canAfford(board, currentPlayer, 'city');
          if (!afford.valid) { Render.flashInvalid(svg, x, y); showError(afford.reason); return; }

          delete board.pieces.settlements[vIdx];
          board.pieces.cities[vIdx] = currentPlayer;
          Board.payCost(board, currentPlayer, 'city');

          Render.drawPieces(svg, board, PLAYER_COLORS);
          updatePlayerPanels();
          updateTurnUI();
          clearInfoBar();

          const winner = Board.checkWinner(board);
          if (winner) { triggerWin(winner); return; }
        }
      }

      function onEdgeClick(eIdx) {
        if (board.gameState.gameEnded) return;
        if (currentMode !== 'road') return;

        const isOpening = board.gameState.phase === 'opening';

        // Turn-order gates
        if (!isOpening && board.gameState.turnPhase === 'roll') {
          showError('roll dice before building');
          return;
        }
        if (Board.getCurrentPlayer(board) !== currentPlayer) {
          const edge = board.graph.edges[eIdx];
          Render.flashInvalid(svg, (edge.x1 + edge.x2) / 2, (edge.y1 + edge.y2) / 2);
          showError(`not your turn — it's ${Board.getCurrentPlayer(board)}'s turn`);
          return;
        }
        if (isOpening && board.gameState.openingStep !== 'road') {
          const edge = board.graph.edges[eIdx];
          Render.flashInvalid(svg, (edge.x1 + edge.x2) / 2, (edge.y1 + edge.y2) / 2);
          showError('place your settlement first');
          return;
        }

        const edge = board.graph.edges[eIdx];
        const mx   = (edge.x1 + edge.x2) / 2;
        const my   = (edge.y1 + edge.y2) / 2;

        const place = Board.canPlaceRoad(board, eIdx, currentPlayer);
        if (!place.valid) { Render.flashInvalid(svg, mx, my); showError(place.reason); return; }

        const afford = Board.canAfford(board, currentPlayer, 'road');
        if (!afford.valid) { Render.flashInvalid(svg, mx, my); showError(afford.reason); return; }

        board.pieces.roads[eIdx] = currentPlayer;
        Board.payCost(board, currentPlayer, 'road');

        if (isOpening) {
          Board.advanceOpening(board);
          const transitioned = board.gameState.phase === 'main';
          syncPlayerAndMode();
          Render.drawPieces(svg, board, PLAYER_COLORS);
          updatePlayerPanels();
          updateTurnUI();
          if (transitioned) {
            infoBar.style.color = '#7fffb0';
            infoBar.textContent = 'Opening complete! Red rolls first.';
          }
          return;
        }

        Render.drawPieces(svg, board, PLAYER_COLORS);
        updatePlayerPanels();
        updateTurnUI();
        clearInfoBar();
      }

      // ----- Board utility -----
      function isBalanced(b) {
        for (let i = 0; i < b.tiles.length; i++) {
          if (b.numbers[i] !== 6 && b.numbers[i] !== 8) continue;
          for (const n of Board.getNeighbors(i, b.positions)) {
            if (b.numbers[n] === 6 || b.numbers[n] === 8) return false;
          }
        }
        return true;
      }

      // ----- Button handlers -----
      document.getElementById('toggle-graph-btn').addEventListener('click', () => {
        graphVisible = !graphVisible;
        applyGraphVisibility();
      });

      document.querySelectorAll('[data-mode]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.disabled) return;
          document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
        });
      });

      document.getElementById('clear-pieces-btn').addEventListener('click', () => {
        board.pieces = { settlements: {}, cities: {}, roads: {} };
        board.players = {
          red:    { wood: 0, brick: 0, wheat: 0, wool: 0, ore: 0 },
          blue:   { wood: 0, brick: 0, wheat: 0, wool: 0, ore: 0 },
          white:  { wood: 0, brick: 0, wheat: 0, wool: 0, ore: 0 },
          orange: { wood: 0, brick: 0, wheat: 0, wool: 0, ore: 0 },
        };
        board.gameState.winner    = null;
        board.gameState.gameEnded = false;
        Render.drawPieces(svg, board, PLAYER_COLORS);
        updatePlayerPanels();
        updateTurnUI();
      });

      rollBtn.addEventListener('click', () => {
        if (board.gameState.turnPhase !== 'roll') {
          showError('already rolled — end your turn first');
          return;
        }
        const roll   = Board.rollDice();
        Render.drawDice(svg, roll.d1, roll.d2);
        const result = Board.distributeResources(board, roll.total);
        board.gameState.diceRolled = true;
        board.gameState.turnPhase  = 'build';
        const entry = document.createElement('p');
        entry.textContent = result.log;
        const rollLog = document.getElementById('roll-log');
        rollLog.insertBefore(entry, rollLog.firstChild);
        Render.drawPieces(svg, board, PLAYER_COLORS);
        updatePlayerPanels();
        updateTurnUI();
      });

      endBtn.addEventListener('click', () => {
        if (board.gameState.turnPhase !== 'build') {
          showError('must roll dice before ending your turn');
          return;
        }
        Board.endTurn(board);
        clearInfoBar();
        updateTurnUI();
        updatePlayerPanels();
      });

      document.getElementById('regenerate-btn').addEventListener('click', () => {
        clearInfoBar();
        renderAndWire(Board.generateBoard());
      });

      document.getElementById('balanced-btn').addEventListener('click', () => {
        let b = Board.generateBoard();
        for (let attempt = 0; attempt < 199; attempt++) {
          if (isBalanced(b)) break;
          b = Board.generateBoard();
        }
        clearInfoBar();
        renderAndWire(b);
      });

      // ----- Initial render -----
      renderAndWire(Board.generateBoard());
    });
  </script>
</body>
</html>
