<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catan Clone</title>

  <!-- board.js and render.js are deferred: they download in parallel,
       then execute in order after all HTML is parsed, before DOMContentLoaded. -->
  <script src="board.js" defer></script>
  <script src="render.js" defer></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #2b8fd6;
      min-height: 100vh;
      padding: 24px 16px 40px;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    h1 {
      color: #ffffff;
      font-size: 2rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      letter-spacing: 1px;
    }

    #info-bar {
      color: #ffffff;
      font-size: 0.85rem;
      opacity: 0.9;
      min-height: 1.3em; /* keeps layout stable when text changes */
      text-align: center;
    }

    /* The SVG fills this container; viewBox="0 0 800 800" is set by renderBoard */
    #board {
      width: 100%;
      max-width: 700px;
      height: auto;
      background: #2b8fd6;        /* ocean blue shows through gaps around hex grid */
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .btn-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #ffffff;
      color: #1a1a2e;
      border: none;
      border-radius: 24px;
      padding: 10px 28px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover  { transform: translateY(-2px); box-shadow: 0 5px 14px rgba(0,0,0,0.3); }
    button:active { transform: translateY(0);    box-shadow: 0 2px  6px rgba(0,0,0,0.2); }

    #seed-label {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.72rem;
      font-family: monospace;
    }

    #controls {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 16px;
      padding: 10px 20px;
      width: 100%;
      max-width: 700px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .control-label {
      color: rgba(255, 255, 255, 0.85);
      font-size: 0.8rem;
      font-weight: bold;
    }
    /* Player color circles — override the general button pill shape */
    .player-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      padding: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
    }
    .player-btn.active {
      border: 3px solid #000;
      outline: 2px solid white;
      outline-offset: 1px;
    }
    .player-btn:hover, .player-btn:active { transform: none; }
    /* Mode buttons — pill-shaped but smaller and subtler than the board buttons */
    .mode-btn {
      background: rgba(255, 255, 255, 0.18);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: bold;
      box-shadow: none;
    }
    .mode-btn.active {
      background: white;
      color: #1a1a2e;
      border-color: white;
    }
    .mode-btn:hover:not(.active) { background: rgba(255, 255, 255, 0.32); box-shadow: none; }
    .mode-btn:hover, .mode-btn:active { transform: none; }
  </style>
</head>
<body>

  <h1>Catan Clone</h1>
  <p id="info-bar">Click a tile to inspect it or move the robber</p>

  <div id="controls">
    <div class="control-group">
      <span class="control-label">Player</span>
      <button class="player-btn active" data-player="red"    style="background:#d33" title="Red"></button>
      <button class="player-btn"        data-player="blue"   style="background:#36c" title="Blue"></button>
      <button class="player-btn"        data-player="white"  style="background:#eee" title="White"></button>
      <button class="player-btn"        data-player="orange" style="background:#f80" title="Orange"></button>
    </div>
    <div class="control-group">
      <span class="control-label">Mode</span>
      <button class="mode-btn active" data-mode="settlement">Settlement</button>
      <button class="mode-btn"        data-mode="city">City</button>
      <button class="mode-btn"        data-mode="road">Road</button>
    </div>
    <button id="clear-pieces-btn">Clear Pieces</button>
  </div>

  <svg id="board"></svg>

  <div class="btn-row">
    <button id="regenerate-btn">Regenerate</button>
    <button id="balanced-btn">Balanced</button>
    <button id="toggle-graph-btn">Toggle Graph</button>
  </div>
  <div id="seed-label"></div>

  <!-- Socket.io client — served automatically by the server at this URL -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    // Socket.io connection: runs immediately (doesn't need the DOM or other scripts)
    const socket = io();
    socket.on('connect', () => console.log('connected to server'));

    // Everything that uses Board / Render must wait until DOMContentLoaded,
    // because deferred scripts (board.js, render.js) finish executing just before
    // that event fires — so window.Board and window.Render are guaranteed to exist here.
    document.addEventListener('DOMContentLoaded', () => {

      // ----- Element refs -----
      const svg       = document.getElementById('board');
      const infoBar   = document.getElementById('info-bar');
      const seedLabel = document.getElementById('seed-label');

      // ----- Lookup tables -----
      const RESOURCE = {
        forest:    'Wood',
        pasture:   'Wool',
        fields:    'Wheat',
        hills:     'Brick',
        mountains: 'Ore',
        desert:    null,
      };
      // Number → how many ways out of 36 to roll it
      const PROB = { 2:1, 3:2, 4:3, 5:4, 6:5, 8:5, 9:4, 10:3, 11:2, 12:1 };

      // ----- Board state -----
      let board;
      let graphVisible = false;  // hidden by default now that pieces are visible

      const PLAYER_COLORS = { red: '#d33', blue: '#36c', white: '#eee', orange: '#f80' };
      let currentPlayer = 'red';
      let currentMode   = 'settlement';
      let errorTimer    = null;

      // Applies the current graphVisible state to the debug group in the SVG.
      // Called after every render and after the toggle button is pressed.
      function applyGraphVisibility() {
        const g = svg.querySelector('#graph-debug');
        if (g) g.style.display = graphVisible ? '' : 'none';
      }

      function showError(reason) {
        clearTimeout(errorTimer);
        infoBar.style.color = '#ff8080';
        infoBar.textContent = reason;
        errorTimer = setTimeout(clearInfoBar, 2000);
      }

      function clearInfoBar() {
        clearTimeout(errorTimer);
        errorTimer = null;
        infoBar.style.color = '';
        infoBar.textContent = 'Click a tile to inspect it or move the robber';
      }

      // Full re-render: wipes the SVG and rebuilds all layers in z-order.
      // Called after every board change (initial load, Regenerate, Balanced, robber move).
      function renderAndWire(b) {
        board = b;
        Render.renderBoard(svg, board);                                // tiles + tokens + robber
        Render.attachClickHandlers(svg, board, onTileClick);           // tile click handlers
        Render.drawGraphDebug(svg, board);                             // debug overlay
        applyGraphVisibility();
        Render.drawPieces(svg, board, PLAYER_COLORS);                  // settlement/city/road shapes
        Render.attachVertexClickHandlers(svg, board, onVertexClick);   // transparent vertex hit areas
        Render.attachEdgeClickHandlers(svg, board, onEdgeClick);       // transparent edge hit areas
        seedLabel.textContent = `Seed: ${board.seed}`;
      }

      // Called when the player clicks a hex tile
      function onTileClick(idx) {
        clearTimeout(errorTimer);
        errorTimer = null;
        infoBar.style.color = '';

        const type   = board.tiles[idx];
        const number = board.numbers[idx]; // undefined for desert

        if (type === 'desert') {
          infoBar.textContent = 'Desert — produces nothing, robber lives here';
          return;
        }

        // Move the robber and do a full re-render so all layers stay consistent
        board.robber = idx;
        renderAndWire(board);

        const resource = RESOURCE[type];
        const prob     = PROB[number] || 0;
        const label    = type.charAt(0).toUpperCase() + type.slice(1);
        infoBar.textContent =
          `${label} → ${resource} · rolls on ${number} · ${prob}/36 odds`;
      }

      // Vertex click: place/upgrade with full Catan placement rules
      function onVertexClick(vIdx) {
        const { x, y } = board.graph.vertices[vIdx];
        if (currentMode === 'settlement') {
          const r = Board.canPlaceSettlement(board, vIdx, currentPlayer);
          if (r.valid) {
            board.pieces.settlements[vIdx] = currentPlayer;
            Render.drawPieces(svg, board, PLAYER_COLORS);
            clearInfoBar();
          } else {
            Render.flashInvalid(svg, x, y);
            showError(r.reason);
          }
        } else if (currentMode === 'city') {
          const r = Board.canUpgradeToCity(board, vIdx, currentPlayer);
          if (r.valid) {
            delete board.pieces.settlements[vIdx];   // city replaces settlement
            board.pieces.cities[vIdx] = currentPlayer;
            Render.drawPieces(svg, board, PLAYER_COLORS);
            clearInfoBar();
          } else {
            Render.flashInvalid(svg, x, y);
            showError(r.reason);
          }
        }
      }

      // Edge click: place a road with full Catan placement rules
      function onEdgeClick(eIdx) {
        if (currentMode !== 'road') return;
        const edge = board.graph.edges[eIdx];
        const mx   = (edge.x1 + edge.x2) / 2;
        const my   = (edge.y1 + edge.y2) / 2;
        const r    = Board.canPlaceRoad(board, eIdx, currentPlayer);
        if (r.valid) {
          board.pieces.roads[eIdx] = currentPlayer;
          Render.drawPieces(svg, board, PLAYER_COLORS);
          clearInfoBar();
        } else {
          Render.flashInvalid(svg, mx, my);
          showError(r.reason);
        }
      }

      // Returns true when no two 6/8 tiles share an edge
      function isBalanced(b) {
        for (let i = 0; i < b.tiles.length; i++) {
          if (b.numbers[i] !== 6 && b.numbers[i] !== 8) continue;
          for (const n of Board.getNeighbors(i, b.positions)) {
            if (b.numbers[n] === 6 || b.numbers[n] === 8) return false;
          }
        }
        return true;
      }

      // ----- Button handlers -----
      document.getElementById('toggle-graph-btn').addEventListener('click', () => {
        graphVisible = !graphVisible;
        applyGraphVisibility();
      });

      document.querySelectorAll('.player-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentPlayer = btn.dataset.player;
        });
      });

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = btn.dataset.mode;
        });
      });

      document.getElementById('clear-pieces-btn').addEventListener('click', () => {
        board.pieces = { settlements: {}, cities: {}, roads: {} };
        Render.drawPieces(svg, board, PLAYER_COLORS);
      });

      document.getElementById('regenerate-btn').addEventListener('click', () => {
        clearInfoBar();
        renderAndWire(Board.generateBoard());
      });

      document.getElementById('balanced-btn').addEventListener('click', () => {
        // Try up to 200 boards; use the last one regardless if none are balanced
        let b = Board.generateBoard();
        for (let attempt = 0; attempt < 199; attempt++) {
          if (isBalanced(b)) break;
          b = Board.generateBoard();
        }
        clearInfoBar();
        renderAndWire(b);
      });

      // ----- Initial render -----
      renderAndWire(Board.generateBoard());
    });
  </script>
</body>
</html>
